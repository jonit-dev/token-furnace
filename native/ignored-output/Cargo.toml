[package]
name = "tf-ignored-output"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
